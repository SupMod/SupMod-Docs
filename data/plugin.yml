      supmod.alerts.xray: true
      supmod.alerts.view: true
      supmod.bypass.spam: true
      supmod.bypass.advertising: true
      supmod.bypass.chatlock: true
      supmod.bypass.slowmode: true
      supmod.bypass.chatclear: true
      supmod.health: true
