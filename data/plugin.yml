name: SupMod
main: fr.supmod.SupModPlugin
version: '2.4.0'
api-version: '1.21'
author: Alstarte
description: Moderation suite - reports, punishments, staff mode, anti-spam, alerts, rewards, bounties, stats and economy.
website: https://www.spigotmc.org/resources/supmod.108806/
softdepend:
  - PlaceholderAPI
  - Vault

commands:
  supmod:
    description: SupMod staff and admin command
    aliases: [sm]
  report:
    description: Report a player to the staff
    aliases: [rp]
  coins:
    description: Coins economy
    aliases: [c]
  playtime:
    description: Show play time
    aliases: [pt]
  broadcast:
    description: Broadcast a message to the whole server
    aliases: [br]
  warn:
    description: Warn a player
    usage: /warn <player> [reason] [-s]
  mute:
    description: Mute a player (temporarily or permanently)
    usage: /mute <player> [duration] [reason] [-s]
    aliases: [tempmute]
  unmute:
    description: Unmute a player
    usage: /unmute <player> [reason]
  kick:
    description: Kick a player
    usage: /kick <player> [reason] [-s]
  ban:
    description: Ban a player (temporarily or permanently)
    usage: /ban <player> [duration] [reason] [-s]
    aliases: [tempban]
  ipban:
    description: Ban a player and his IP address
    usage: /ipban <player> [duration] [reason] [-s]
    aliases: [banip]
  unban:
    description: Unban a player
    usage: /unban <player> [reason]
  history:
    description: Punishment history of a player
    usage: /history <player>
    aliases: [sanctions, hist]
  punish:
    description: Punishment menu of a player, or apply a template
    usage: /punish <player> [template] [-s]
    aliases: [sanction]
  staffmode:
    description: Toggle the staff mode
    aliases: [mod]
  vanish:
    description: Become invisible to the players
    aliases: [v]
  freeze:
    description: Freeze or unfreeze a player
    usage: /freeze <player>
    aliases: [ss]
  staffchat:
    description: Staff chat (toggle, or send a message)
    usage: /staffchat [message]
    aliases: [sc]
  commandspy:
    description: See the commands typed by the players
    aliases: [cmdspy, spy]
  rewards:
    description: Play time and daily rewards
    aliases: [reward, recompenses]
  daily:
    description: Claim the daily reward
    aliases: [dailyreward, journalier]
  bounty:
    description: Put a price on the head of a player
    usage: /bounty <player> <amount> | list
    aliases: [bounties, prime]
  sidebar:
    description: Show or hide the sidebar
    aliases: [sb]
  stats:
    description: Statistics and leaderboards
    usage: /stats [player] | top [board]
    aliases: [statistics, statistiques]
  gm:
    description: Change the game mode (menu without argument)
    usage: /gm <0-3|mode> [player]
  gmc:
    description: Creative mode
    usage: /gmc [player]
  gms:
    description: Survival mode
    usage: /gms [player]
  gma:
    description: Adventure mode
    usage: /gma [player]
  gmsp:
    description: Spectator mode
    usage: /gmsp [player]
  ticket:
    description: Ask the staff for help (tickets)
    usage: /ticket <message> | reply | close | view
    aliases: [tickets, support]
  helpop:
    description: Ask the staff for help (creates a ticket)
    usage: /helpop <message>
    aliases: [aide]
  appeal:
    description: Appeal a punishment
    usage: /appeal <message> | /appeal <code> <message>
    aliases: [appel, unbanrequest]
  afk:
    description: Away from keyboard
    aliases: [away]
  # 2.4 social
  ignore:
    description: Ignore a player (his chat messages are hidden from you)
    usage: /ignore <player> | add <player> | list | remove <player>
    aliases: [ignorer]
  unignore:
    description: Stop ignoring a player
    usage: /unignore <player>
  staff:
    description: Staff members online, who can help you
    aliases: [stafflist, helpers, equipe]
  poll:
    description: Vote in the current poll; staff - create, end or cancel a poll
    usage: /poll [vote <n>] | create [duration] <question> | <answer> | <answer>... | end | cancel
    aliases: [polls, sondage]

permissions:
  supmod.*:
    description: Every SupMod permission
    default: op
    children:
      supmod.admin: true

  # ---------- Players ----------
  supmod.report:
    description: Use /report
    default: true
  supmod.help:
    description: Use /supmod help
    default: true
  supmod.playtime:
    description: Use /playtime
    default: true
  supmod.playtime.others:
    description: See the play time of other players and /playtime top
    default: true
  supmod.coins:
    description: See your own coins balance
    default: true
  supmod.coins.pay:
    description: Pay another player
    default: true
  supmod.coins.player:
    description: See the balance of another player
    default: true
  supmod.coins.top:
    description: See the richest players
    default: true
  supmod.coins.history:
    description: See your own transactions (/coins history)
    default: true
  supmod.rewards:
    description: Use /rewards and /daily, receive the rewards
    default: true
  supmod.bounty:
    description: Place bounties
    default: true
  supmod.bounty.list:
    description: See the bounties
    default: true
  supmod.stats:
    description: Use /stats
    default: true
  supmod.stats.others:
    description: See the statistics of other players
    default: true
  supmod.sidebar.toggle:
    description: Show or hide the sidebar with /sidebar
    default: true
  supmod.ticket:
    description: Create tickets (/ticket, /helpop), answer, close and rate them
    default: true
  supmod.appeal:
    description: Appeal a punishment (/appeal)
    default: true
  supmod.afk:
    description: Use /afk
    default: true

